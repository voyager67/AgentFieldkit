<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AgentFieldkit — Equip your agents. Raise the standard.</title>
  <desc id="desc">A dark, technical banner with a luminous connected-node pattern and AgentFieldkit wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.56" stop-color="#121932"/>
      <stop offset="1" stop-color="#101C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69EACB"/>
      <stop offset="0.55" stop-color="#7C83FF"/>
      <stop offset="1" stop-color="#BE8CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="40%" r="70%">
      <stop offset="0" stop-color="#5367D9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5367D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9EACD6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <g opacity="0.72" stroke="url(#accent)" stroke-width="1.7" fill="none">
    <path d="M710 75L800 125L895 83L1004 142L1100 89"/>
    <path d="M710 75L738 180L832 218L895 83"/>
    <path d="M738 180L683 268L810 290L832 218L950 284L1004 142"/>
    <path d="M832 218L916 172L1037 215L1100 89"/>
    <path d="M950 284L1037 215L1120 268"/>
  </g>
  <g fill="#0F172B" stroke="url(#accent)" stroke-width="2.4" filter="url(#softGlow)">
    <circle cx="710" cy="75" r="7"/><circle cx="800" cy="125" r="5"/><circle cx="895" cy="83" r="8"/>
    <circle cx="1004" cy="142" r="6"/><circle cx="1100" cy="89" r="5"/><circle cx="738" cy="180" r="7"/>
    <circle cx="832" cy="218" r="8"/><circle cx="683" cy="268" r="5"/><circle cx="810" cy="290" r="6"/>
    <circle cx="950" cy="284" r="7"/><circle cx="916" cy="172" r="5"/><circle cx="1037" cy="215" r="8"/><circle cx="1120" cy="268" r="5"/>
  </g>
  <g transform="translate(76 90)">
    <rect x="0" y="0" width="48" height="48" rx="13" fill="#15223A" stroke="url(#accent)" stroke-width="1.5"/>
    <path d="M13 12H35M13 24H29M13 36H35" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 12V36" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="2.5" stroke-linecap="round"/>
    <text x="66" y="29" fill="#F7FAFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750" letter-spacing="-1.6">AGENTFIELDKIT</text>
    <text x="68" y="57" fill="#9EACD6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" letter-spacing="3.8">THE OPEN AGENT FIELD KIT</text>
  </g>
  <text x="76" y="214" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="41" font-weight="750" letter-spacing="-1.3">Equip your agents.</text>
  <text x="76" y="263" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="41" font-weight="750" letter-spacing="-1.3">Raise the standard.</text>
  <text x="78" y="307" fill="#B6C0DD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="0.2">25 portable skills for engineering, AI/ML research, and multi-agent work.</text>
  <rect x="76" y="329" width="110" height="4" rx="2" fill="url(#accent)"/>
  <rect x="194" y="329" width="34" height="4" rx="2" fill="#6475BA" opacity="0.65"/>
  <rect x="236" y="329" width="15" height="4" rx="2" fill="#6475BA" opacity="0.4"/>
</svg>
