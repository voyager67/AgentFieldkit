name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate skill library
        run: python scripts/validate_skills.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test ChatGPT skill packaging
        run: python scripts/package_chatgpt.py --target chatgpt --output "${RUNNER_TEMP}/agentfieldkit-chatgpt"

      - name: Smoke-test Claude skill packaging
        run: python scripts/package_chatgpt.py --target claude --output "${RUNNER_TEMP}/agentfieldkit-claude"
